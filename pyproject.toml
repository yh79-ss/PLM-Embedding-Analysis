[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-embedding-diagnostics"
version = "0.1.0"
description = "Portable diagnostics for protein variant embeddings and protein-disjoint evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "scikit-learn>=1.1", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.6"]

[project.scripts]
vep-diagnostics = "vep_diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vep_diagnostics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
